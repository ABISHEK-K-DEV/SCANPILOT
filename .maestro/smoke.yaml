# End-to-end smoke test on a real Android emulator (CI: .github/workflows/android-apk.yml).
# Walks the main journeys of a fresh install; any crash fails the run (scripts/e2e/run.sh).
appId: app.scanpilot
---
- launchApp:
    clearState: true
# A slow CI emulator sometimes shows a system "isn't responding" dialog for
# the launcher over the app; dismiss it (Wait) so it does not hide the screen.
- runFlow:
    when:
      visible: ".*isn't responding"
    commands:
      - tapOn: "Wait"

# Introduction
- extendedWaitUntil:
    visible: "Paper to PDF in seconds"
    timeout: 30000
    optional: true
- runFlow:
    when:
      visible: ".*isn't responding"
    commands:
      - tapOn: "Wait"
- extendedWaitUntil:
    visible: "Paper to PDF in seconds"
    timeout: 60000
- takeScreenshot: e2e-results/01-introduction
- tapOn: "Continue"
- tapOn: "Continue"
- tapOn: "Get started"

# Home
- extendedWaitUntil:
    visible: "Scan a document"
    timeout: 20000
- assertVisible: "Quick tools"
- takeScreenshot: e2e-results/02-home

# A tool, with its first-use guide
- tapOn: "Tools"
- assertVisible: "Merge PDF"
- tapOn: "Merge PDF"
- extendedWaitUntil:
    visible: "HOW IT WORKS"
    timeout: 10000
- takeScreenshot: e2e-results/03-merge-guide
- tapOn: "Got it"
- assertVisible: "Combine several PDFs into one"
- assertVisible: "Scan with camera"
- back

# Camera → review → save (camera permission granted at install with adb -g)
- tapOn: "Home"
- tapOn: "Scan document"
- extendedWaitUntil:
    visible: "HOW IT WORKS"
    timeout: 15000
- tapOn: "Got it"
- extendedWaitUntil:
    visible: "Manual capture"
    timeout: 20000
- tapOn: "Manual capture"
- takeScreenshot: e2e-results/04-camera
# Wait until the camera is streaming (the shutter is enabled), then shoot.
- extendedWaitUntil:
    visible:
      text: "Take photo"
      enabled: true
    timeout: 30000
- tapOn: "Take photo"
- extendedWaitUntil:
    visible: "Done, .*"
    timeout: 30000
    optional: true
# If the live camera cannot shoot on this device, the app switches to the
# standard camera and asks for another photo.
- runFlow:
    when:
      notVisible: "Done, .*"
    commands:
      - extendedWaitUntil:
          visible:
            text: "Take photo"
            enabled: true
          timeout: 30000
      - tapOn: "Take photo"
      - extendedWaitUntil:
          visible: "Done, .*"
          timeout: 60000
- tapOn: "Done, .*"
- extendedWaitUntil:
    visible: "Review scan"
    timeout: 20000
- tapOn: "Filter"
- takeScreenshot: e2e-results/05-review-filter
- tapOn: "Save PDF.*"
- extendedWaitUntil:
    visible: "Add pages"
    timeout: 120000
- takeScreenshot: e2e-results/06-document
- back

# Files, Settings, Licence
- tapOn: "Files"
- assertVisible: "Search documents"
- tapOn: "Settings"
- assertVisible: "Scanner"
- scrollUntilVisible:
    element: "Licence"
    direction: DOWN
- tapOn: "Licence.*"
- assertVisible: "MIT License"
- takeScreenshot: e2e-results/07-licence

# The crash screen must never have appeared.
- assertNotVisible: "This screen ran into a problem"
