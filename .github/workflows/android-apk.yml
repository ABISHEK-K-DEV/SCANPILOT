# Builds an installable, standalone ScanPilot APK (JavaScript bundled inside,
# no Metro/dev server needed) and publishes it as a workflow artifact.
#
# The release build is signed with the Expo template's public debug keystore:
# fine for sideloading and testing, NOT for Google Play (use EAS / your own
# upload key for that).
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: ['claude/**', main, master]
    paths-ignore: ['**.md', 'docs/**']

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Android SDK
        # compileSdk 37 / build-tools 37 / NDK 27.1 come from the Expo SDK 58 Gradle plugin.
        # Package names for new platforms can differ (e.g. "android-37" vs "android-37.0"),
        # so resolve them from the live repository listing; anything still missing is
        # downloaded by the Android Gradle plugin once licences are accepted.
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "$SDKM" --licenses > /dev/null
          "$SDKM" "cmdline-tools;latest" > /dev/null || true
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "$SDKM" --licenses > /dev/null
          "$SDKM" --list 2>/dev/null > /tmp/sdk-list.txt || true
          echo "Available platforms / build-tools (36+):"
          grep -oE '^ *(platforms;android-3[6-9][^ ]*|build-tools;3[6-9][^ ]*)' /tmp/sdk-list.txt | sort -u || true
          PLATFORM=$(grep -oE 'platforms;android-37(\.[0-9]+)?' /tmp/sdk-list.txt | head -1 || true)
          BUILD_TOOLS=$(grep -oE 'build-tools;37\.0\.0' /tmp/sdk-list.txt | head -1 || true)
          for pkg in $PLATFORM $BUILD_TOOLS "ndk;27.1.12297006"; do
            echo "Installing $pkg"
            "$SDKM" "$pkg" > /dev/null || echo "::warning::Could not pre-install $pkg; Gradle will try to download it."
          done

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and unit tests
        run: |
          npm run typecheck
          npm test -- --ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: android
        env:
          NODE_ENV: production
        run: >
          ./gradlew assembleRelease --no-daemon --stacktrace
          -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
          -Pandroid.enableMinifyInReleaseBuilds=false
          -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g"

      - name: Rename APK
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/release/app-release.apk "dist-apk/ScanPilot-${VERSION}-${GITHUB_SHA::7}.apk"
          ls -lh dist-apk

      - uses: actions/upload-artifact@v4
        with:
          name: ScanPilot-apk
          path: dist-apk/*.apk
          if-no-files-found: error
          retention-days: 30
