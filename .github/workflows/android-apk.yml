# Builds an installable, standalone ScanPilot APK (JavaScript bundled inside,
# no Metro/dev server needed) and publishes it as a workflow artifact.
#
# Release builds have no INTERNET permission (SCANPILOT_OFFLINE=1) and use the
# run number as versionCode.
#
# Signing: when the repository secrets SCANPILOT_UPLOAD_KEYSTORE_BASE64,
# SCANPILOT_UPLOAD_STORE_PASSWORD, SCANPILOT_UPLOAD_KEY_ALIAS and
# SCANPILOT_UPLOAD_KEY_PASSWORD are set, the APK and a Play Store AAB are
# signed with that upload key (see docs/RELEASE.md). Without them the APK is
# signed with the public debug key: fine for sideloading, not for Google Play.
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Android SDK
        # compileSdk 37 / build-tools 37 / NDK 27.1 come from the Expo SDK 58 Gradle plugin.
        # Package names for new platforms can differ (e.g. "android-37" vs "android-37.0"),
        # so resolve them from the live repository listing; anything still missing is
        # downloaded by the Android Gradle plugin once licences are accepted.
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "$SDKM" --licenses > /dev/null
          "$SDKM" "cmdline-tools;latest" > /dev/null || true
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "$SDKM" --licenses > /dev/null
          "$SDKM" --list 2>/dev/null > /tmp/sdk-list.txt || true
          echo "Available platforms / build-tools (36+):"
          grep -oE '^ *(platforms;android-3[6-9][^ ]*|build-tools;3[6-9][^ ]*)' /tmp/sdk-list.txt | sort -u || true
          PLATFORM=$(grep -oE 'platforms;android-37(\.[0-9]+)?' /tmp/sdk-list.txt | head -1 || true)
          BUILD_TOOLS=$(grep -oE 'build-tools;37\.0\.0' /tmp/sdk-list.txt | head -1 || true)
          for pkg in $PLATFORM $BUILD_TOOLS "ndk;27.1.12297006"; do
            echo "Installing $pkg"
            "$SDKM" "$pkg" > /dev/null || echo "::warning::Could not pre-install $pkg; Gradle will try to download it."
          done

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and unit tests
        run: |
          npm run typecheck
          npm test -- --ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'
          SCANPILOT_OFFLINE: '1'
          SCANPILOT_ABI_SPLITS: '1'
          SCANPILOT_VERSION_CODE: ${{ github.run_number }}

      - name: Prepare upload key (if configured)
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.SCANPILOT_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
            echo "store=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_OUTPUT"
            echo "Signing with the upload key."
          else
            echo "::notice::No upload key secrets set; the APK is signed with the debug key (sideloading only)."
          fi

      - uses: gradle/actions/setup-gradle@v6

      - name: Build release APK
        working-directory: android
        env:
          NODE_ENV: production
          SCANPILOT_UPLOAD_STORE_FILE: ${{ steps.signing.outputs.store }}
          SCANPILOT_UPLOAD_STORE_PASSWORD: ${{ secrets.SCANPILOT_UPLOAD_STORE_PASSWORD }}
          SCANPILOT_UPLOAD_KEY_ALIAS: ${{ secrets.SCANPILOT_UPLOAD_KEY_ALIAS }}
          SCANPILOT_UPLOAD_KEY_PASSWORD: ${{ secrets.SCANPILOT_UPLOAD_KEY_PASSWORD }}
        run: >
          ./gradlew assembleRelease ${{ steps.signing.outputs.store && 'bundleRelease' || '' }} --no-daemon --stacktrace
          -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64
          -Pandroid.enableMinifyInReleaseBuilds=false
          -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g"

      - name: Rename APK
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          mkdir -p dist-apk
          OUT=android/app/build/outputs/apk/release
          ls -lh "$OUT"
          # Most phones: arm64. Older 32-bit phones: universal (works everywhere, larger).
          cp "$OUT/app-arm64-v8a-release.apk" "dist-apk/ScanPilot-${VERSION}-${GITHUB_SHA::7}.apk"
          cp "$OUT/app-universal-release.apk" "dist-apk/ScanPilot-${VERSION}-${GITHUB_SHA::7}-universal.apk"
          mkdir -p e2e-apk
          cp "$OUT/app-x86_64-release.apk" e2e-apk/ScanPilot-x86_64.apk
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab "dist-apk/ScanPilot-${VERSION}-${GITHUB_SHA::7}.aab"
          fi
          ls -lh dist-apk

      - uses: actions/upload-artifact@v7
        with:
          name: ScanPilot-apk
          path: |
            dist-apk/*.apk
            dist-apk/*.aab
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v7
        with:
          name: ScanPilot-e2e-apk
          path: e2e-apk/*.apk
          retention-days: 3

  # Installs the real release APK on an Android 14 emulator and walks the main
  # journeys with Maestro (.maestro/smoke.yaml). Fails on any crash.
  e2e:
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ScanPilot-e2e-apk
          path: e2e-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MAESTRO_CLI_NO_ANALYTICS: '1'
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated
          script: bash scripts/e2e/run.sh e2e-apk/ScanPilot-x86_64.apk

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ScanPilot-e2e-results
          # Maestro writes screenshots relative to the flow file.
          path: |
            e2e-results/
            .maestro/e2e-results/
          retention-days: 14
